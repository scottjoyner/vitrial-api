name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit + contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      # Reproducible deps: install the pinned transitive closure from the lock, then the
      # package itself with --no-deps so pyproject ranges never silently float in CI.
      - run: pip install -r requirements-lock.txt
      - run: pip install -e '.[dev]' --no-deps
      # Consistency guard: the same lock must produce a self-consistent environment.
      - run: pip check
      - run: python -m compileall -q app migrations tests scripts
      - run: python scripts/validate_backend_contract.py
      - name: Guard-prefix lint (no declared guard maps to a dead route)
        run: python scripts/check_guard_prefixes.py
      # The image installs requirements-runtime-lock.txt, so that file governs the
      # shipped artifact, and every version in it must be the version CI tests above.
      #
      # VITR-V017: this step used to re-resolve against LIVE PyPI and compare, so it went
      # red whenever any transitive dependency published -- no code change, both agents
      # blocked, and the tempting "fix" (regenerate) would silently upgrade the DB driver.
      # It is now two deterministic checks:
      #   1. --check is OFFLINE: each runtime pin equals the combined-lock pin, every
      #      declared runtime dependency is pinned, and no dev tooling ships.
      #   2. Closure: install the runtime lock exactly as the Dockerfile does
      #      (--no-deps, then the project --no-deps) in a clean venv and `pip check`.
      #      Pinned versions, so downloads are needed but no resolution happens.
      # Alert rules: promtool validates PromQL syntax; tests/test_alert_rules.py (in the
      # suite) validates that every metric, label and closed label value the rules name is
      # one the service actually exports. Each half catches what the other cannot -- valid
      # PromQL against a misspelled metric matches nothing and never fires.
      # Pinned exactly, like gitleaks: a validator that changes between runs makes two runs
      # incomparable. v3.5.0 is the version the rules were first validated against.
      - name: Alert rules are valid PromQL (promtool)
        run: |
          set -euo pipefail
          PROM_VERSION=3.5.0
          curl -sSfL \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
            -o /tmp/prometheus.tgz
          tar -xzf /tmp/prometheus.tgz -C /tmp "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          "/tmp/prometheus-${PROM_VERSION}.linux-amd64/promtool" check rules deploy/prometheus/alerts.yml
      - name: Runtime lock agrees with the combined lock (offline, deterministic)
        run: python scripts/generate_runtime_lock.py --check
      - name: Runtime lock is a complete closure (installs as the Dockerfile does)
        run: |
          python -m venv /tmp/runtime-closure
          /tmp/runtime-closure/bin/python -m pip install --quiet --no-deps -r requirements-runtime-lock.txt
          /tmp/runtime-closure/bin/python -m pip install --quiet --no-deps .
          /tmp/runtime-closure/bin/python -m pip check
      # Structural guards on the BEAM umbrella. Both are pure-stdlib Python and
      # read only source, so they belong in this job rather than the BEAM one:
      # no toolchain needed, about a second to run, and a scaffold or a dead
      # module then fails a push in seconds instead of after a container image
      # pull and a full umbrella compile.
      #
      # Unused *variables* are the BEAM job's job -- `mix compile
      # --warnings-as-errors` fails on them, which was verified by injecting one
      # rather than assumed. These two cover the shapes the compiler cannot see:
      # an app that is entirely intention, and a module that is entirely
      # documentation. Both are enforced in BOTH directions -- adding an
      # undeclared scaffold fails, and so does leaving a declared one in place
      # after the app is built.
      - name: BEAM scaffold registry (no undeclared `mix new` app)
        run: python scripts/check_beam_scaffold.py
      - name: BEAM orphan sweep (no lib module that nothing calls and nothing tests)
        run: python scripts/check_beam_orphans.py
      - run: python -m pytest -q

  postgres:
    name: PostgreSQL + S3 integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vitrial
          POSTGRES_USER: vitrial
          POSTGRES_PASSWORD: vitrial
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vitrial -d vitrial"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=20
    env:
      DATABASE_URL: postgresql+asyncpg://vitrial:vitrial@localhost:5432/vitrial
      DATABASE_NULL_POOL: "true"
      POSTGRES_INTEGRATION: "1"
      EVIDENCE_STORAGE_PROVIDER: s3
      EVIDENCE_GC_GRACE_SECONDS: "0"
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: vitrials3secret
      S3_SECRET_ACCESS_KEY: vitrials3secret
      S3_BUCKET: vitrial-evidence
      S3_REGION: us-east-1
      # Overridable per repository so the object-storage image can be changed
      # without a code change. Must be an S3 server taking RUSTFS_ACCESS_KEY /
      # RUSTFS_SECRET_KEY / RUSTFS_VOLUMES and serving /health on :9000.
      S3_IMAGE: ${{ vars.S3_IMAGE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      # MinIO's distribution has been withdrawn: the pinned image is 401 on both
      # quay.io and Docker Hub (verified 2026-09-28, including a control pull of
      # library/alpine that succeeded, so it is MinIO's repos and not the token
      # flow), and dl.min.io now answers 410 Gone. RustFS is a real S3
      # implementation -- Apache 2.0 rather than AGPL -- published to two
      # registries, so a single-registry outage cannot break this again.
      #
      # This step is deliberately best-effort. The S3 tests are the only thing
      # that needs object storage; the PostgreSQL integration tests, the
      # Alembic upgrade/downgrade proof and the contract validation do not. If
      # the image cannot be pulled or does not become healthy, S3_INTEGRATION is
      # set to 0 so those tests skip with an honest reason instead of the whole
      # job failing at setup. The job therefore cannot get worse than it is now.
      - name: Start S3-compatible object storage
        run: |
          set -uo pipefail
          image="${S3_IMAGE:-rustfs/rustfs:latest}"
          # The fallback tag is unpinned, so a new upstream release changes what CI is
          # testing without any code change. `postgres:17` is pinned to a major for the
          # same reason reproducibility matters here. Set the `S3_IMAGE` repository
          # variable to a digest to make this explicit; until then, say so on every run
          # so a surprise object-storage change is visible in the log rather than
          # inferred later.
          if [ "$image" = "rustfs/rustfs:latest" ]; then
            echo "::warning::S3_IMAGE is unset; falling back to the unpinned $image. A new upstream release will change what CI tests."
          fi
          echo "object storage image: $image"
          if ! docker run -d --name vitrial-s3 \
            -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY="$S3_ACCESS_KEY_ID" \
            -e RUSTFS_SECRET_KEY="$S3_SECRET_ACCESS_KEY" \
            -e RUSTFS_VOLUMES=/data \
            "$image" >/dev/null 2>&1; then
            echo "::warning::could not start $image; S3 integration tests will skip"
            docker logs vitrial-s3 2>/dev/null || true
            echo "S3_INTEGRATION=0" >> "$GITHUB_ENV"
            exit 0
          fi
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:9000/health >/dev/null 2>&1; then
              echo "S3 integration tests are live against $image"
              echo "S3_INTEGRATION=1" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo "::warning::$image did not become healthy; S3 integration tests will skip"
          docker logs vitrial-s3 2>/dev/null || true
          echo "S3_INTEGRATION=0" >> "$GITHUB_ENV"
      - name: Create evidence bucket
        if: env.S3_INTEGRATION == '1'
        run: |
          python - <<'PY'
          import boto3
          from botocore.client import Config
          client = boto3.client(
              "s3",
              endpoint_url="http://localhost:9000",
              aws_access_key_id="vitrials3secret",
              aws_secret_access_key="vitrials3secret",
              region_name="us-east-1",
              config=Config(s3={"addressing_style": "path"}),
          )
          client.create_bucket(Bucket="vitrial-evidence")
          PY
      - name: Prove upgrade from zero and reversible baseline
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: python scripts/validate_backend_contract.py
      - run: python -m pytest -q

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t vitrial-api:ci .

  beam:
    name: BEAM umbrella (compile + format + test)
    runs-on: ubuntu-latest

    # A real PostgreSQL, for `VitrialSync.Db`'s live suite. Without this service
    # the BEAM job reported `657 passed, 20 skipped` and called it green — the
    # 20 being `live_db_test.exs`, which skips itself and prints why:
    #
    #   [db] live-postgresql suite NOT RUN (no server reachable at
    #   $VITRIAL_TEST_DATABASE_URL): no server reachable: :econnrefused
    #
    # That is a hand-written PostgreSQL v3 wire client whose entire risk lives in
    # whether the bytes are right, and nothing in CI was exercising the bytes.
    # Twelve wire defects were found once by a builder against a local server;
    # the next one will not be found the same way. The Python `postgres` job
    # below has had this service all along — the BEAM job was simply never given
    # one.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vitrial
          POSTGRES_USER: vitrial
          POSTGRES_PASSWORD: vitrial
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vitrial -d vitrial"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=10

    env:
      # The live suite refuses to run without this, which is the correct default:
      # a skipped wire protocol is indistinguishable from a correct one until a
      # query fails in production.
      # localhost, WITH a password, and that combination is deliberate.
      #
      # The suite runs in a `--network=host` container, which shares the RUNNER's
      # network namespace. GitHub publishes the service on the runner's
      # 127.0.0.1:5432 (that is what `ports: - 5432:5432` means), so localhost is
      # correct from there. The service alias `postgres` does NOT resolve from a
      # host-network container — it only resolves on the `github_network` a
      # non-host container would join — which is why an earlier attempt using it
      # could not work from the suite at all.
      #
      # The password is required for the same reason: reaching the runner's
      # published port means a real TCP connection, and the service's pg_hba
      # demands SCRAM for host connections. `Pgconn` implements AuthenticationOk
      # and MD5 but NOT SCRAM-SHA-256 (named in its moduledoc), so a password
      # alone will not authenticate either — the first CI run with this wired up
      # is what will prove it, and SCRAM is the next thing to build if it fails.
      VITRIAL_TEST_DATABASE_URL: postgresql://vitrial:vitrial@localhost:5432/vitrial

    steps:
      - uses: actions/checkout@v7

      # Ready for when the first hex dependency lands. With zero deps this is a
      # no-op today; once cowboy/epgsql are admitted, an uncached _build turns every
      # push into a full cold compile of OTP-level artifacts.
      - uses: actions/cache@v6
        with:
          path: |
            .cache/mix-deps
            .cache/mix-build
            .cache/hex
            .cache/rebar3
          key: beam-${{ runner.os }}-${{ hashFiles('beam/mix.lock', 'beam/mix.exs', 'beam/apps/*/mix.exs') }}
          restore-keys: |
            beam-${{ runner.os }}-

      # Toolchain, not host. The build runs inside the same pinned image the release
      # image is cut from, so a compile that passes here is a compile that passes on
      # the runner that produces artifacts. Installing Erlang/Elixir onto an
      # ubuntu-latest runner via setup-beam or apt would let the two drift silently.
      #
      # Versions are current as of 2026-10-02: Elixir 1.20.4 / OTP erts 29.1.1. The
      # `beam/` umbrella requires `elixir: "~> 1.19"`; this is the newest release on
      # that constraint, deliberately three OTP majors ahead of the estate's
      # ci/beam-compat:v1 image (OTP 27.3.4.2), which is the version this code will
      # NOT be allowed to compile against.
      #
      # `-slim` rather than the default variant: the memory cap below is only
      # meaningful if the image does not ship a desktop environment's worth of
      # resident memory before the BEAM starts.
      - name: Resolve toolchain versions (and fail on drift)
        run: |
          set -euo pipefail
          docker run --rm --memory=3g --memory-swap=6g \
            -v "$PWD/beam:/work" -w /work \
            "$BEAM_IMAGE" bash -lc '
              set -euo pipefail
              elixir --version
              erl -noshell -eval "io:format(\"~s~n\",[erlang:system_info(otp_release)]), halt()."
            '
        env:
          BEAM_IMAGE: hexpm/elixir:1.20.4-erlang-29.1.1-debian-bookworm-20260918-slim

      # One job, not a batch matrix. loom-platform needs `validate:elixir-batch`
      # (4 x ~8 apps, per-batch _build slices, --memory=3g) because 33 umbrella apps
      # with heavy dependencies OOM-killed the BEAM in a single 6 GB container
      # (#20). This umbrella is 8 apps with ZERO hex dependencies, so peak compile
      # memory is nowhere near a cap and a matrix would buy nothing but wall-clock.
      #
      # The batch structure is the escalation path, not the starting point. Add it
      # when the first real dependencies land (cowboy/epgsql per
      # DEPENDENCY-DOCTRINE.md), at which point copy loom's job shape verbatim:
      # parallel.matrix over BATCH_INDEX, a per-batch _build mount, and
      # `mix compile --warnings-as-errors ${ELIXIR_APPS}`. Doing it now would be
      # scaffolding for a problem this repository does not have.
      #
      # What is kept from loom's job, because it applies at any scale: the container
      # memory cap, the `_build`/`deps` bind mounts (so the host runner cache is
      # populated and reused), and propagating the container exit code rather than
      # letting a non-zero `docker run` be swallowed by a pipeline.
      # The live suite needs the schema the migrations produce. Without this the
      # probe reports "schema not applied (sync_entities missing)" and skips,
      # which is a correct verdict on a correct client and still leaves the wire
      # protocol untested — so the table has to be there before the suite runs.
      #
      # Run against the service container directly, on the GitHub network, which
      # is the only place `postgres:5432` resolves from a job step.
      # Runs INSIDE a container on the job's network, not on the runner. A job
      # step executes on the runner host, where the service alias `postgres`
      # does not resolve — the previous version of this step failed with
      #     socket.gaierror: [Errno -3] Temporary failure in name resolution
      # which names neither the cause nor the fix. Only a container on the
      # service network can see it.
      #
      # --network=container:pgfinal-equivalent is not available here, so the
      # container joins the JOB's network by alias, exactly as the service does.
      # Runs on the RUNNER, not in a container. The runner publishes the service
      # on its own 127.0.0.1:5432, so it is the one place that can reach it
      # without a network namespace of its own:
      #   - a job step on the runner: reaches 127.0.0.1:5432 directly
      #   - a `--network=host` container: reaches the runner's 127.0.0.1:5432
      #   - a container on `github_network`: reaches `postgres:5432` only
      # The previous version of this step ran on the runner and used the alias,
      # and failed with `socket.gaierror: [Errno -3] Temporary failure in name
      # resolution` — the third case reached with the second case's address.
      - name: Apply migrations to the live PostgreSQL
        run: |
          set -euo pipefail
          pip install --quiet "sqlalchemy[asyncio]>=2" asyncpg alembic pydantic pydantic-settings
          DATABASE_URL="postgresql+asyncpg://vitrial:vitrial@localhost:5432/vitrial" \
            alembic upgrade head

      - name: Build the gate image (pinned BEAM toolchain + the oracle's python)
        run: docker build -q -t server-api-beam-gate:ci -f beam/Dockerfile.gate .

      - name: Compile, format-check and test the umbrella
        run: |
          set -euo pipefail
          mkdir -p .cache/hex .cache/rebar3 .cache/mix-deps .cache/mix-build
          set +e
          docker run --rm --network=host \
            --memory=3g --memory-swap=6g \
            -v "$PWD:/work" \
            -v "$PWD/.cache/mix-deps:/work/beam/deps" \
            -v "$PWD/.cache/mix-build:/work/beam/_build" \
            -v "$PWD/.cache/hex:/root/.hex" \
            -v "$PWD/.cache/rebar3:/root/.rebar3" \
            -w /work/beam "$BEAM_IMAGE" bash -lc '
              set -euo pipefail
              mix local.hex --force --if-missing
              mix local.rebar --force --if-missing
              mix deps.get
              mix compile --warnings-as-errors
              mix format --check-formatted
              mix test
            ' 2>&1 | tee .ci-beam.log
          DOCKER_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$DOCKER_EXIT" -ne 0 ]; then
            echo "ERROR: BEAM container exited ${DOCKER_EXIT}."
            exit "$DOCKER_EXIT"
          fi

          # Two ways this job can quietly test nothing, and BOTH now fail it.
          #
          # The parity harness skips itself when it cannot execute the Python
          # oracle; the live PostgreSQL suite skips itself when it cannot reach a
          # server or find the schema. Either way the job would otherwise report
          # green having agreed with nothing — and a green tick beside "20 skipped"
          # reads as parity when it is the absence of parity.
          #
          # The previous guard matched only 'SKIPPED', so it caught the harness
          # and MISSED the live suite, which announces itself as 'NOT RUN'. That
          # is the same defect as the boto3 stub and the harness skipping itself:
          # a check scoped to one shape of the thing it means to catch.
          if grep -qE 'SKIPPED|NOT RUN' .ci-beam.log; then
            echo "ERROR: a suite skipped itself, so this job verified nothing:"
            grep -aE 'SKIPPED|NOT RUN' .ci-beam.log
            exit 1
          fi

          # And say so when it did run, so "green" is distinguishable from "the
          # live suite was never there" by reading the log rather than guessing.
          grep -aE 'Result:' .ci-beam.log | tail -1

        env:
          # The gate image, not the bare pinned one. beam/Dockerfile.gate is the
          # pinned hexpm/elixir image plus python3 and pydantic and changes nothing
          # else -- same OTP, same Elixir, same Debian release. It exists because
          # the parity oracle AST-lifts the Python reference out of `app/` and
          # executes it, and the bare image has no interpreter: with it this job
          # reported 532 passed / 23 skipped and called that green.
          #
          # The repo root is mounted, not just `beam/`, for the same reason -- the
          # oracle reads `app/`, which lives outside the umbrella. Mounting only
          # `beam/` made the harness skip for a reason that looks like a code fault.
          BEAM_IMAGE: server-api-beam-gate:ci

      # Run on the host, not in the container: only /work (beam/) is bind-mounted,
      # so the container cannot see the repository's git dir. A lockfile that moved
      # means the resolved dependency set floated, which is the entire CVE surface
      # this repository keeps collapsed into one committed file.
      - name: Fail if the resolved dependency set drifted
        run: |
          set -euo pipefail
          if ! git diff --quiet -- beam/mix.lock; then
            echo "ERROR: beam/mix.lock changed during the build."
            echo "The dependency set is not pinned. Diff:"
            git diff -- beam/mix.lock
            exit 1
          fi
          echo "mix.lock unchanged; dependency set is pinned."

      - name: Publish compile log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: beam-compile-log
          path: .ci-beam.log
          retention-days: 7

  security:
    name: Security (deps, secrets, image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: gitleaks is a secret scanner, and a secret that landed
          # and was removed in an earlier commit is exactly the one worth finding.
          # The default shallow checkout cannot see it, which makes a passing scan
          # a statement about the tip and nothing else.
          fetch-depth: 0
      - name: Secrets scan (gitleaks)
        # The official CLI rather than zricethezav/gitleaks-action@v2.
        #
        # That action takes no configuration input -- action.yml at the v2 tag is
        # six lines with no `inputs:` block at all -- so `.gitleaks.toml` in the
        # repository root is never passed to the scan. An allowlist written there
        # is silently ignored, which is worse than not writing one: it looks like
        # the exceptions were reviewed and were not.
        #
        # The CLI discovers `.gitleaks.toml` by default and needs no flag for it.
        # Pinned to an exact version rather than a range, because a secrets scanner
        # that changes its rule set between runs makes two runs incomparable.
        #
        # There is deliberately no checksum assertion here. A checksum that has
        # not been verified against the published release is not a supply-chain
        # control, it is a comment that looks like one -- and a fabricated one is
        # worse than none, because a later reader assumes it was checked. Until the
        # real digest is fetched from the release page and pinned, the version pin
        # and TLS are what this step actually guarantees.
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.28.0
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
          # --redact so a real finding cannot leak the secret into this job's log
          # by being reported. --verbose so an allowlisted finding is visible as
          # allowlisted rather than invisible as absent.
          gitleaks detect --source . --redact --verbose --no-banner
      - name: Dependency + filesystem vulnerability scan (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Build image for scan
        run: docker build -t vitrial-api:security .
      - name: Container image scan (trivy)
        # exit-code was '0', with no comment saying why: a fixable HIGH/CRITICAL CVE in the
        # image we SHIP was printed to the log and the job still passed. The filesystem
        # scan above already fails on the same severities, so the shipped artifact was the
        # one thing reported on and never enforced. ignore-unfixed keeps the base image's
        # unfixable Debian backlog from making this a permanent red; what remains is
        # actionable by definition. Flipped when the image measured 0 such findings across
        # all 36 targets (CI run 37574980293), so enforcing it did not redden main.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: vitrial-api:security
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Image SBOM (CycloneDX)
        # A bill of materials for the exact image that was scanned, so "is CVE-X in what we
        # shipped?" is answerable from an artifact after the fact rather than by rebuilding
        # an image that may no longer reproduce. Generated from the image, not the source
        # tree, because the image is what runs.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: vitrial-api:security
          format: cyclonedx
          output: sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
          if-no-files-found: error

  deployment:
    name: Acceptance deployment topology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build hardened application image
        run: docker build -t vitrial-api:deployment-smoke .
      - name: Generate ephemeral host-only acceptance configuration
        run: |
          cat > /tmp/vitrial-acceptance.env <<'EOF'
          API_HOST=localhost
          API_IMAGE=vitrial-api:deployment-smoke
          CADDY_IMAGE=caddy:2-alpine
          SERVICE_VERSION=0.3.0-ci
          DATABASE_URL=postgresql+asyncpg://vitrial:ci-postgres-secret-12345@postgres:5432/vitrial
          DATABASE_NULL_POOL=false
          S3_BUCKET=vitrial-evidence
          S3_REGION=us-east-1
          ADMIN_API_KEY_HASH=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          POSTGRES_IMAGE=postgres:17
          POSTGRES_DB=vitrial
          POSTGRES_USER=vitrial
          POSTGRES_PASSWORD=ci-postgres-secret-12345
          S3_IMAGE=${{ vars.S3_IMAGE || 'rustfs/rustfs:1.0.0' }}
          S3_ROOT_USER=ci-s3-access-12345
          S3_ROOT_PASSWORD=ci-s3-secret-12345
          HTTP_PORT=8080
          HTTPS_PORT=8443
          CADDY_MAX_REQUEST_BODY=4MB
          CADDYFILE_PATH=./Caddyfile.smoke
          EOF
          chmod 600 /tmp/vitrial-acceptance.env
      - name: Fail-closed config validation and Compose rendering
        run: |
          python scripts/validate_deployment.py \
            --env-file /tmp/vitrial-acceptance.env \
            --mode acceptance \
            --allow-localhost \
            --allow-mutable-images
          docker compose --env-file /tmp/vitrial-acceptance.env \
            -f deploy/compose.acceptance.yml config >/dev/null
      - name: Boot migrations, persistent services, API and internal-CA HTTPS edge
        run: |
          docker compose --env-file /tmp/vitrial-acceptance.env \
            -f deploy/compose.acceptance.yml up -d
          for attempt in $(seq 1 30); do
            if curl -kfsS https://localhost:8443/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file /tmp/vitrial-acceptance.env \
            -f deploy/compose.acceptance.yml ps
          docker compose --env-file /tmp/vitrial-acceptance.env \
            -f deploy/compose.acceptance.yml logs --no-color
          exit 1
      # Two independent durability claims, and both of them are real:
      #   - a row written through Postgres is still there after a container restart
      #   - an object written through the application's own S3 client is still there
      #     after the storage container restarts
      #
      # The second replaces a marker file written straight into the storage
      # container's /data volume. That proved a Docker named volume persists, which
      # Docker guarantees, and said nothing about the S3 contract the application
      # actually depends on. Pinned by tests/test_deployment_topology_claims.py.
      - name: Prove dependency readiness and restart persistence
        run: |
          COMPOSE="docker compose --env-file /tmp/vitrial-acceptance.env -f deploy/compose.acceptance.yml"
          $COMPOSE exec -T api python scripts/probe_dependencies.py
          $COMPOSE exec -T postgres psql -U vitrial -d vitrial -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE IF NOT EXISTS deployment_smoke (id integer primary key); INSERT INTO deployment_smoke (id) VALUES (1) ON CONFLICT DO NOTHING;"
          $COMPOSE exec -T api python scripts/probe_evidence_durability.py write
          $COMPOSE restart postgres s3 api
          for attempt in $(seq 1 30); do
            if curl -kfsS https://localhost:8443/health >/dev/null; then
              break
            fi
            sleep 2
          done
          test "$($COMPOSE exec -T postgres psql -U vitrial -d vitrial -Atc 'SELECT count(*) FROM deployment_smoke WHERE id = 1')" = "1"
          $COMPOSE exec -T api python scripts/probe_evidence_durability.py verify
          $COMPOSE exec -T api python scripts/probe_dependencies.py --quiet
      - name: Tear down smoke deployment
        if: always()
        run: |
          docker compose --env-file /tmp/vitrial-acceptance.env \
            -f deploy/compose.acceptance.yml down -v --remove-orphans || true

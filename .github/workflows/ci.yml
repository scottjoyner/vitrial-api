name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit + contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q app migrations tests scripts
      - run: python scripts/validate_backend_contract.py
      - run: python -m pytest -q

  postgres:
    name: PostgreSQL + S3 integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vitrial
          POSTGRES_USER: vitrial
          POSTGRES_PASSWORD: vitrial
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vitrial -d vitrial"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=20
    env:
      DATABASE_URL: postgresql+asyncpg://vitrial:vitrial@localhost:5432/vitrial
      DATABASE_NULL_POOL: "true"
      POSTGRES_INTEGRATION: "1"
      S3_INTEGRATION: "1"
      EVIDENCE_STORAGE_PROVIDER: s3
      EVIDENCE_GC_GRACE_SECONDS: "0"
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: vitrial-evidence
      S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Start S3-compatible MinIO
        run: |
          docker run -d --name vitrial-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs vitrial-minio
          exit 1
      - name: Create evidence bucket
        run: |
          python - <<'PY'
          import boto3
          from botocore.client import Config
          client = boto3.client(
              "s3",
              endpoint_url="http://localhost:9000",
              aws_access_key_id="minioadmin",
              aws_secret_access_key="minioadmin",
              region_name="us-east-1",
              config=Config(s3={"addressing_style": "path"}),
          )
          client.create_bucket(Bucket="vitrial-evidence")
          PY
      - name: Prove upgrade from zero and reversible baseline
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: python scripts/validate_backend_contract.py
      - run: python -m pytest -q

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vitrial-api:ci .

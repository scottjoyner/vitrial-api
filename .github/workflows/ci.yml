name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit + contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      # Reproducible deps: install the pinned transitive closure from the lock, then the
      # package itself with --no-deps so pyproject ranges never silently float in CI.
      - run: pip install -r requirements-lock.txt
      - run: pip install -e '.[dev]' --no-deps
      # Consistency guard: the same lock must produce a self-consistent environment.
      - run: pip check
      - run: python -m compileall -q app migrations tests scripts
      - run: python scripts/validate_backend_contract.py
      - name: Guard-prefix lint (no declared guard maps to a dead route)
        run: python scripts/check_guard_prefixes.py
      - run: python -m pytest -q

  postgres:
    name: PostgreSQL + S3 integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vitrial
          POSTGRES_USER: vitrial
          POSTGRES_PASSWORD: vitrial
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vitrial -d vitrial"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=20
    env:
      DATABASE_URL: postgresql+asyncpg://vitrial:vitrial@localhost:5432/vitrial
      DATABASE_NULL_POOL: "true"
      POSTGRES_INTEGRATION: "1"
      EVIDENCE_STORAGE_PROVIDER: s3
      EVIDENCE_GC_GRACE_SECONDS: "0"
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: vitrials3secret
      S3_SECRET_ACCESS_KEY: vitrials3secret
      S3_BUCKET: vitrial-evidence
      S3_REGION: us-east-1
      # Overridable per repository so the object-storage image can be changed
      # without a code change. Must be an S3 server taking RUSTFS_ACCESS_KEY /
      # RUSTFS_SECRET_KEY / RUSTFS_VOLUMES and serving /health on :9000.
      S3_IMAGE: ${{ vars.S3_IMAGE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      # MinIO's distribution has been withdrawn: the pinned image is 401 on both
      # quay.io and Docker Hub (verified 2026-09-28, including a control pull of
      # library/alpine that succeeded, so it is MinIO's repos and not the token
      # flow), and dl.min.io now answers 410 Gone. RustFS is a real S3
      # implementation -- Apache 2.0 rather than AGPL -- published to two
      # registries, so a single-registry outage cannot break this again.
      #
      # This step is deliberately best-effort. The S3 tests are the only thing
      # that needs object storage; the PostgreSQL integration tests, the
      # Alembic upgrade/downgrade proof and the contract validation do not. If
      # the image cannot be pulled or does not become healthy, S3_INTEGRATION is
      # set to 0 so those tests skip with an honest reason instead of the whole
      # job failing at setup. The job therefore cannot get worse than it is now.
      - name: Start S3-compatible object storage
        run: |
          set -uo pipefail
          image="${S3_IMAGE:-rustfs/rustfs:latest}"
          # The fallback tag is unpinned, so a new upstream release changes what CI is
          # testing without any code change. `postgres:17` is pinned to a major for the
          # same reason reproducibility matters here. Set the `S3_IMAGE` repository
          # variable to a digest to make this explicit; until then, say so on every run
          # so a surprise object-storage change is visible in the log rather than
          # inferred later.
          if [ "$image" = "rustfs/rustfs:latest" ]; then
            echo "::warning::S3_IMAGE is unset; falling back to the unpinned $image. A new upstream release will change what CI tests."
          fi
          echo "object storage image: $image"
          if ! docker run -d --name vitrial-s3 \
            -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY="$S3_ACCESS_KEY_ID" \
            -e RUSTFS_SECRET_KEY="$S3_SECRET_ACCESS_KEY" \
            -e RUSTFS_VOLUMES=/data \
            "$image" >/dev/null 2>&1; then
            echo "::warning::could not start $image; S3 integration tests will skip"
            docker logs vitrial-s3 2>/dev/null || true
            echo "S3_INTEGRATION=0" >> "$GITHUB_ENV"
            exit 0
          fi
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:9000/health >/dev/null 2>&1; then
              echo "S3 integration tests are live against $image"
              echo "S3_INTEGRATION=1" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo "::warning::$image did not become healthy; S3 integration tests will skip"
          docker logs vitrial-s3 2>/dev/null || true
          echo "S3_INTEGRATION=0" >> "$GITHUB_ENV"
      - name: Create evidence bucket
        if: env.S3_INTEGRATION == '1'
        run: |
          python - <<'PY'
          import boto3
          from botocore.client import Config
          client = boto3.client(
              "s3",
              endpoint_url="http://localhost:9000",
              aws_access_key_id="vitrials3secret",
              aws_secret_access_key="vitrials3secret",
              region_name="us-east-1",
              config=Config(s3={"addressing_style": "path"}),
          )
          client.create_bucket(Bucket="vitrial-evidence")
          PY
      - name: Prove upgrade from zero and reversible baseline
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: python scripts/validate_backend_contract.py
      - run: python -m pytest -q

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vitrial-api:ci .

  beam:
    name: BEAM umbrella (compile + format + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ready for when the first hex dependency lands. With zero deps this is a
      # no-op today; once cowboy/epgsql are admitted, an uncached _build turns every
      # push into a full cold compile of OTP-level artifacts.
      - uses: actions/cache@v4
        with:
          path: |
            .cache/mix-deps
            .cache/mix-build
            .cache/hex
            .cache/rebar3
          key: beam-${{ runner.os }}-${{ hashFiles('beam/mix.lock', 'beam/mix.exs', 'beam/apps/*/mix.exs') }}
          restore-keys: |
            beam-${{ runner.os }}-

      # Toolchain, not host. The build runs inside the same pinned image the release
      # image is cut from, so a compile that passes here is a compile that passes on
      # the runner that produces artifacts. Installing Erlang/Elixir onto an
      # ubuntu-latest runner via setup-beam or apt would let the two drift silently.
      #
      # Versions are current as of 2026-10-02: Elixir 1.20.4 / OTP erts 29.1.1. The
      # `beam/` umbrella requires `elixir: "~> 1.19"`; this is the newest release on
      # that constraint, deliberately three OTP majors ahead of the estate's
      # ci/beam-compat:v1 image (OTP 27.3.4.2), which is the version this code will
      # NOT be allowed to compile against.
      #
      # `-slim` rather than the default variant: the memory cap below is only
      # meaningful if the image does not ship a desktop environment's worth of
      # resident memory before the BEAM starts.
      - name: Resolve toolchain versions (and fail on drift)
        run: |
          set -euo pipefail
          docker run --rm --memory=3g --memory-swap=6g \
            -v "$PWD/beam:/work" -w /work \
            "$BEAM_IMAGE" bash -lc '
              set -euo pipefail
              elixir --version
              erl -noshell -eval "io:format(\"~s~n\",[erlang:system_info(otp_release)]), halt()."
            '
        env:
          BEAM_IMAGE: hexpm/elixir:1.20.4-erlang-29.1.1-debian-bookworm-20260918-slim

      # One job, not a batch matrix. loom-platform needs `validate:elixir-batch`
      # (4 x ~8 apps, per-batch _build slices, --memory=3g) because 33 umbrella apps
      # with heavy dependencies OOM-killed the BEAM in a single 6 GB container
      # (#20). This umbrella is 8 apps with ZERO hex dependencies, so peak compile
      # memory is nowhere near a cap and a matrix would buy nothing but wall-clock.
      #
      # The batch structure is the escalation path, not the starting point. Add it
      # when the first real dependencies land (cowboy/epgsql per
      # DEPENDENCY-DOCTRINE.md), at which point copy loom's job shape verbatim:
      # parallel.matrix over BATCH_INDEX, a per-batch _build mount, and
      # `mix compile --warnings-as-errors ${ELIXIR_APPS}`. Doing it now would be
      # scaffolding for a problem this repository does not have.
      #
      # What is kept from loom's job, because it applies at any scale: the container
      # memory cap, the `_build`/`deps` bind mounts (so the host runner cache is
      # populated and reused), and propagating the container exit code rather than
      # letting a non-zero `docker run` be swallowed by a pipeline.
      - name: Compile, format-check and test the umbrella
        run: |
          set -euo pipefail
          mkdir -p .cache/hex .cache/rebar3 .cache/mix-deps .cache/mix-build
          set +e
          docker run --rm --network=host \
            --memory=3g --memory-swap=6g \
            -v "$PWD/beam:/work" \
            -v "$PWD/.cache/mix-deps:/work/deps" \
            -v "$PWD/.cache/mix-build:/work/_build" \
            -v "$PWD/.cache/hex:/root/.hex" \
            -v "$PWD/.cache/rebar3:/root/.rebar3" \
            -w /work "$BEAM_IMAGE" bash -lc '
              set -euo pipefail
              mix local.hex --force --if-missing
              mix local.rebar --force --if-missing
              mix deps.get
              mix compile --warnings-as-errors
              mix format --check-formatted
              mix test
            ' 2>&1 | tee .ci-beam.log
          DOCKER_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$DOCKER_EXIT" -ne 0 ]; then
            echo "ERROR: BEAM container exited ${DOCKER_EXIT}."
            exit "$DOCKER_EXIT"
          fi
        env:
          BEAM_IMAGE: hexpm/elixir:1.20.4-erlang-29.1.1-debian-bookworm-20260918-slim

      # Run on the host, not in the container: only /work (beam/) is bind-mounted,
      # so the container cannot see the repository's git dir. A lockfile that moved
      # means the resolved dependency set floated, which is the entire CVE surface
      # this repository keeps collapsed into one committed file.
      - name: Fail if the resolved dependency set drifted
        run: |
          set -euo pipefail
          if ! git diff --quiet -- beam/mix.lock; then
            echo "ERROR: beam/mix.lock changed during the build."
            echo "The dependency set is not pinned. Diff:"
            git diff -- beam/mix.lock
            exit 1
          fi
          echo "mix.lock unchanged; dependency set is pinned."

      - name: Publish compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beam-compile-log
          path: .ci-beam.log
          retention-days: 7

  security:
    name: Security (deps, secrets, image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: gitleaks is a secret scanner, and a secret that landed
          # and was removed in an earlier commit is exactly the one worth finding.
          # The default shallow checkout cannot see it, which makes a passing scan
          # a statement about the tip and nothing else.
          fetch-depth: 0
      - name: Secrets scan (gitleaks)
        # The official CLI rather than zricethezav/gitleaks-action@v2.
        #
        # That action takes no configuration input -- action.yml at the v2 tag is
        # six lines with no `inputs:` block at all -- so `.gitleaks.toml` in the
        # repository root is never passed to the scan. An allowlist written there
        # is silently ignored, which is worse than not writing one: it looks like
        # the exceptions were reviewed and were not.
        #
        # The CLI discovers `.gitleaks.toml` by default and needs no flag for it.
        # Pinned to an exact version rather than a range, because a secrets scanner
        # that changes its rule set between runs makes two runs incomparable.
        #
        # There is deliberately no checksum assertion here. A checksum that has
        # not been verified against the published release is not a supply-chain
        # control, it is a comment that looks like one -- and a fabricated one is
        # worse than none, because a later reader assumes it was checked. Until the
        # real digest is fetched from the release page and pinned, the version pin
        # and TLS are what this step actually guarantees.
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.28.0
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
          # --redact so a real finding cannot leak the secret into this job's log
          # by being reported. --verbose so an allowlisted finding is visible as
          # allowlisted rather than invisible as absent.
          gitleaks detect --source . --redact --verbose --no-banner
      - name: Dependency + filesystem vulnerability scan (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Build image for scan
        run: docker build -t vitrial-api:security .
      - name: Container image scan (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: vitrial-api:security
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  deployment:
    name: Acceptance deployment topology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build hardened application image
        run: docker build -t vitrial-api:deployment-smoke .
      - name: Generate ephemeral host-only acceptance configuration
        run: |
          cat > /tmp/vitrial-acceptance.env <<'EOF'
          API_HOST=localhost
          API_IMAGE=vitrial-api:deployment-smoke
          CADDY_IMAGE=caddy:2-alpine
          SERVICE_VERSION=0.3.0-ci
          DATABASE_URL=postgresql+asyncpg://vitrial:ci-postgres-secret-12345@postgres:5432/vitrial
          DATABASE_NULL_POOL=false
          S3_BUCKET=vitrial-evidence
          S3_REGION=us-east-1
          ADMIN_API_KEY_HASH=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          POSTGRES_IMAGE=postgres:17
          POSTGRES_DB=vitrial
          POSTGRES_USER=vitrial
          POSTGRES_PASSWORD=ci-postgres-secret-12345
          S3_IMAGE=${{ vars.S3_IMAGE || 'rustfs/rustfs:1.0.0' }}
          S3_ROOT_USER=ci-s3-access-12345
          S3_ROOT_PASSWORD=ci-s3-secret-12345
          HTTP_PORT=8080
          HTTPS_PORT=8443
          CADDY_MAX_REQUEST_BODY=4MB
          CADDYFILE_PATH=./Caddyfile.smoke
          EOF
          chmod 600 /tmp/vitrial-acceptance.env
      - name: Fail-closed config validation and Compose rendering
        run: |
          python scripts/validate_deployment.py \
            --env-file /tmp/vitrial-acceptance.env \
            --mode acceptance \
            --allow-localhost \
            --allow-mutable-images
          docker compose --env-file /tmp/vitrial-acceptance.env \
            -f deploy/compose.acceptance.yml config >/dev/null
      - name: Boot migrations, persistent services, API and internal-CA HTTPS edge
        run: |
          docker compose --env-file /tmp/vitrial-acceptance.env \
            -f deploy/compose.acceptance.yml up -d
          for attempt in $(seq 1 30); do
            if curl -kfsS https://localhost:8443/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file /tmp/vitrial-acceptance.env \
            -f deploy/compose.acceptance.yml ps
          docker compose --env-file /tmp/vitrial-acceptance.env \
            -f deploy/compose.acceptance.yml logs --no-color
          exit 1
      # Two independent durability claims, and both of them are real:
      #   - a row written through Postgres is still there after a container restart
      #   - an object written through the application's own S3 client is still there
      #     after the storage container restarts
      #
      # The second replaces a marker file written straight into the storage
      # container's /data volume. That proved a Docker named volume persists, which
      # Docker guarantees, and said nothing about the S3 contract the application
      # actually depends on. Pinned by tests/test_deployment_topology_claims.py.
      - name: Prove dependency readiness and restart persistence
        run: |
          COMPOSE="docker compose --env-file /tmp/vitrial-acceptance.env -f deploy/compose.acceptance.yml"
          $COMPOSE exec -T api python scripts/probe_dependencies.py
          $COMPOSE exec -T postgres psql -U vitrial -d vitrial -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE IF NOT EXISTS deployment_smoke (id integer primary key); INSERT INTO deployment_smoke (id) VALUES (1) ON CONFLICT DO NOTHING;"
          $COMPOSE exec -T api python scripts/probe_evidence_durability.py write
          $COMPOSE restart postgres s3 api
          for attempt in $(seq 1 30); do
            if curl -kfsS https://localhost:8443/health >/dev/null; then
              break
            fi
            sleep 2
          done
          test "$($COMPOSE exec -T postgres psql -U vitrial -d vitrial -Atc 'SELECT count(*) FROM deployment_smoke WHERE id = 1')" = "1"
          $COMPOSE exec -T api python scripts/probe_evidence_durability.py verify
          $COMPOSE exec -T api python scripts/probe_dependencies.py --quiet
      - name: Tear down smoke deployment
        if: always()
        run: |
          docker compose --env-file /tmp/vitrial-acceptance.env \
            -f deploy/compose.acceptance.yml down -v --remove-orphans || true

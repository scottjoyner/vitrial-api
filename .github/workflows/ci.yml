name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit + contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q app migrations tests scripts
      - run: python scripts/validate_backend_contract.py
      - run: python -m pytest -q

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vitrial
          POSTGRES_USER: vitrial
          POSTGRES_PASSWORD: vitrial
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vitrial -d vitrial"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=20
    env:
      DATABASE_URL: postgresql+asyncpg://vitrial:vitrial@localhost:5432/vitrial
      DATABASE_NULL_POOL: "true"
      POSTGRES_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Prove upgrade from zero and reversible baseline
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: python scripts/validate_backend_contract.py
      - run: python -m pytest -q

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vitrial-api:ci .

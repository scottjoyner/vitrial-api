name: Beam CI

# Same principle as the GitLab fleet lanes: the build runs on a LOCAL
# self-hosted runner (beam-org-025) against the LOCAL toolchain — system
# OTP 28 + Elixir 1.19 + rebar3, never a downloaded runtime.
#
# WAVE 5 CORRECTION, stated honestly: the header here used to claim this gate
# was "fully offline-capable" because the umbrella had zero hex deps. That is no
# longer true — beam/mix.lock is live (epgsql 4.8.0, the dependency doctrine's
# first admission), so a runner whose caches are cold MUST reach hex.pm once.
# What keeps that honest and bounded:
#
#   * the resolved set is ONE package with ZERO transitive closure (epgsql's
#     requirements list is empty), pinned by beam/mix.lock — the drift check in
#     ci.yml's umbrella job covers the same lock from the container lane;
#   * the caches persist on this runner, so after the first run the fetch step
#     is a no-op: `beam/deps/` stays in the checkout, and the Hex archives +
#     package cache live under ~/.mix/archives and ~/.hex. A runner primed by
#     any previous run — of this workflow or of the ci.yml container job, whose
#     baked gate image carries the same cache — needs no network at all.
#   * a COLD runner needs hex.pm (builds.hex.pm) reachable; if this gate must
#     ever run fully airgapped from scratch, prime the runner once on a
#     networked host (mix local.hex && cd beam && mix deps.get) — same shape as
#     the gate image's bake in beam/Dockerfile.gate.
#
# push/workflow_dispatch only. pull_request must never trigger this gate: the
# runner is self-hosted, so building a PR would execute that PR's code on
# beam-org-025. The original reason was that this repo was public, so anyone
# could open a PR; it is private now, but the exclusion stays as defence in
# depth, since a private repo is one settings change away from accepting
# outside contributions again. Same ruling as the caddy repo.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beam-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  beam:
    name: beam/ umbrella (deps + format + compile + tests)
    runs-on: [self-hosted, beam-ci]
    timeout-minutes: 20
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - name: Local toolchain probe (fail loudly if the host loses BEAM)
        run: |
          erl -noshell -eval 'io:format("OTP ~s~n", [erlang:system_info(otp_release)])' -eval 'halt().'
          elixir --version | tail -2
          rebar3 --version
      - name: Differential oracle probe (fail loudly if the host cannot run it)
        run: |
          # The differential harness in vitrial_sync AST-lifts the Python reference
          # and compares answers, and it is the only thing making the parity claims
          # in beam/ARCHITECTURE.md 2.1 mean anything. When it cannot run it
          # *skips* rather than fails, so `mix test` still reports
          # "0 failures" -- the gate goes green while checking less than it
          # claims to.
          #
          # That has already happened: this gate reported
          # "552 tests, 0 failures, 6 skipped" on a host whose python3 could not
          # import pydantic, while the same suite runs all 552 with nothing
          # skipped elsewhere. Six tests were not being checked and nothing said so.
          #
          # beam/Dockerfile.gate was written to close this for the container path
          # ("a gate that skips its own oracle is a gate that cannot fail"). This
          # closes it for the self-hosted path, which ships a python3 that passes
          # a bare interpreter check and fails the real one.
          #
          # Mirrors the two conditions in
          # apps/vitrial_sync/test/support/python_reference.ex: an interpreter on
          # PATH (line 78) and pydantic importable by it (line 97). The pydantic
          # probe is explicit because a missing pydantic otherwise surfaces as a
          # misleading {:error, :trailing_data} rather than a clean skip.
          # Provision pydantic for the runner's interpreter rather than probing
          # for it. The step used to PROBE and fail, which made this gate depend on
          # whatever happens to be installed on the self-hosted host — and it is
          # precisely the host whose pydantic is missing, since that is what the
          # probe has been failing on. A gate whose oracle depends on an operator's
          # earlier `pip install` is not a gate.
          #
          # `|| pip install` rather than a bare install so a primed runner is a
          # no-op, and `--break-system-packages` because a distribution python3
          # outside a virtualenv refuses without it (PEP 668).
          python3 -c 'import pydantic, sys; sys.exit(0)' || \
            python3 -m pip install --quiet --break-system-packages "pydantic>=2,<3" || {
            echo "::error::could not provision pydantic for this runner's interpreter."
            echo "The harness would skip itself and this gate would pass while checking less than it claims."
            exit 1
          }

          python3 -c 'import pydantic, sys; sys.exit(0)' || {
            echo "::error::the differential oracle cannot run here: python3 on PATH cannot import pydantic."
            echo "The harness would skip itself and this gate would pass while checking less than it claims."
            echo "Install pydantic for the runner's interpreter, or run the container gate in beam/Dockerfile.gate."
            exit 1
          }
          echo "differential oracle available (python3 $(python3 -V 2>&1 | cut -d" " -f2), pydantic $(python3 -c 'import pydantic; print(pydantic.VERSION)'))"
      # The dependency provision, matching ci.yml's container lane line for line
      # (mix local.hex / local.rebar / deps.get). --if-missing keeps it a no-op
      # on a primed runner; a cold runner reaches hex.pm here, once, and
      # resolves exactly beam/mix.lock (rebar3 is needed: epgsql is a [:rebar3]
      # build). The caches named above persist between runs on this runner.
      - name: Resolve hex dependencies against beam/mix.lock
        working-directory: beam
        run: mix local.hex --if-missing && mix local.rebar --if-missing && mix deps.get
      - name: Format check
        working-directory: beam
        run: mix format --check-formatted
      - name: Compile
        working-directory: beam
        run: mix compile
      - name: Tests + doctests (all umbrella apps)
        working-directory: beam
        run: mix test

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: vitrial
      POSTGRES_USER: vitrial
      POSTGRES_PASSWORD: vitrial
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitrial -d vitrial"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

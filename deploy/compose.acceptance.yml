name: vitrial-api-acceptance

x-api-environment: &api-environment
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  DATABASE_NULL_POOL: ${DATABASE_NULL_POOL:-false}
  SERVICE_VERSION: ${SERVICE_VERSION:?SERVICE_VERSION is required}
  API_VERSION: v1
  ADMIN_API_KEY_HASH: ${ADMIN_API_KEY_HASH:?ADMIN_API_KEY_HASH is required for acceptance provisioning}
  EVIDENCE_STORAGE_PROVIDER: s3
  EVIDENCE_GC_GRACE_SECONDS: ${EVIDENCE_GC_GRACE_SECONDS:-86400}
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_PART_SIZE_BYTES: ${S3_PART_SIZE_BYTES:-5242880}

services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vitrial}
      POSTGRES_USER: ${POSTGRES_USER:-vitrial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    restart: unless-stopped
    networks: [backend]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: ${MINIO_IMAGE:?MINIO_IMAGE is required}
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    restart: unless-stopped
    networks: [backend]
    volumes:
      - minio-data:/data

  minio-init:
    image: ${MINIO_MC_IMAGE:?MINIO_MC_IMAGE is required}
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
    networks: [backend]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1; do sleep 1; done
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    restart: "no"

  migrate:
    image: ${API_IMAGE:?API_IMAGE is required}
    command: ["alembic", "upgrade", "head"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [backend]
    expose: ["8000"]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "scripts/probe_dependencies.py", "--quiet"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 6

  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE is required}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST:?API_HOST is required}
    networks: [backend]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${CADDYFILE_PATH:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    driver: bridge
    internal: false

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
